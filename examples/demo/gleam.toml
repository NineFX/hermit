name = "demo"
version = "1.0.0"
description = "An example of Rust NIFs generated by hermit"

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
hermit = { path = "../.." }
